<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Left Bracket Gradient (Electric Cyan to Blue) -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Right Bracket Gradient (Blue to Indigo/Purple) -->
    <linearGradient id="bluePurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Connection Bridge Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="3" />

  <!-- Subtle Radial Inner Glow Overlay -->
  <circle cx="256" cy="256" r="180" fill="#0284c7" opacity="0.12" filter="url(#neonGlow)" />

  <!-- Network Circuit Grid Lines (Subtle Tech Accent) -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="80" y1="180" x2="120" y2="180" />
    <circle cx="120" cy="180" r="4" fill="#38bdf8" />

    <line x1="432" y1="332" x2="392" y2="332" />
    <circle cx="392" cy="332" r="4" fill="#a855f7" />

    <line x1="180" y1="90" x2="180" y2="120" />
    <circle cx="180" cy="120" r="3" fill="#38bdf8" />

    <line x1="332" y1="422" x2="332" y2="392" />
    <circle cx="332" cy="392" r="3" fill="#a855f7" />
  </g>

  <!-- Main Symbol Group with Soft Neon Glow -->
  <g filter="url(#softShadow)">
    
    <!-- Central Connection Bridge (Interlinking Node Line) -->
    <path 
      d="M 180 256 Q 256 195 332 256 Q 256 317 180 256 Z" 
      fill="none" 
      stroke="url(#bridgeGrad)" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.85"
    />

    <!-- Left Code Bracket "<" -->
    <path 
      d="M 215 160 L 125 256 L 215 352" 
      fill="none" 
      stroke="url(#cyanBlueGrad)" 
      stroke-width="32" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Right Code Bracket ">" -->
    <path 
      d="M 297 160 L 387 256 L 297 352" 
      fill="none" 
      stroke="url(#bluePurpleGrad)" 
      stroke-width="32" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Interconnected Network Nodes -->
    <!-- Left Top Node -->
    <circle cx="215" cy="160" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
    
    <!-- Left Apex Node -->
    <circle cx="125" cy="256" r="16" fill="#0ea5e9" stroke="#ffffff" stroke-width="4" />
    
    <!-- Left Bottom Node -->
    <circle cx="215" cy="352" r="14" fill="#2563eb" stroke="#ffffff" stroke-width="4" />

    <!-- Center Pulse Core Node (The "Connect" Nexus) -->
    <circle cx="256" cy="256" r="18" fill="#ffffff" filter="url(#neonGlow)" />
    <circle cx="256" cy="256" r="10" fill="#6366f1" />

    <!-- Right Top Node -->
    <circle cx="297" cy="160" r="14" fill="#818cf8" stroke="#ffffff" stroke-width="4" />
    
    <!-- Right Apex Node -->
    <circle cx="387" cy="256" r="16" fill="#a855f7" stroke="#ffffff" stroke-width="4" />
    
    <!-- Right Bottom Node -->
    <circle cx="297" cy="352" r="14" fill="#c084fc" stroke="#ffffff" stroke-width="4" />

  </g>
</svg>
